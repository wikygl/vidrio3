plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    id 'com.google.devtools.ksp'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

// Firma de release: se lee de keystore.properties en la raíz del repo (NO versionado; ver
// keystore.properties.example). Si el archivo no existe, el release cae a la firma debug para no
// romper builds locales. Para publicar en Play crea el keystore y este archivo.
def keystorePropsFile = rootProject.file("keystore.properties")
def hasReleaseKeystore = keystorePropsFile.exists()
def keystoreProps = new Properties()
if (hasReleaseKeystore) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'crystal.crystal'
    compileSdk 35 // Play exige targetSdk 35; AGP 8.13 lo soporta

    defaultConfig {
        applicationId "crystal.crystal"
        minSdk 24
        targetSdk 35
        // SUBIR versionCode EN CADA BUILD QUE SE REPARTA. Android se niega a instalar encima de una
        // versión mayor, y sin este número no hay forma de saber con qué build está cada probador
        // ni de exigir una actualización mínima (ver config/app.versionMinima en Firestore).
        // versionName es lo que ve la gente; versionCode es lo que compara el sistema.
        versionCode 2
        versionName "1.1.0-beta1"
        // Pruebas instrumentadas: corren en el celular, así se puede comprobar que la pantalla
        // hace lo que dice en vez de dar por bueno que compila.
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Dos canales de distribución con reglas de cobro distintas.
    //
    // `directo`  — reparto del APK fuera de tiendas. Lleva el wallet completo: recarga por Yape,
    //              lectura del comprobante y compra del plan dentro de la app.
    // `play`     — Google Play. La política de pagos exige Play Billing para software de gestión
    //              (y la apertura del caso Epic es solo para EE.UU.), así que esta build NO vende
    //              nada: modelo "solo consumo", el usuario paga en la web y la app lo reconoce.
    //
    // La separación es por conjunto de fuentes, no por una bandera en tiempo de ejecución: las
    // clases y los layouts del wallet no entran al APK de Play. Dejar la pantalla inalcanzable pero
    // las cadenas dentro del paquete no sirve — la revisión las encuentra igual.
    flavorDimensions += "canal"
    productFlavors {
        directo {
            dimension "canal"
            isDefault true
        }
        play {
            dimension "canal"
            // Mismo applicationId a propósito: es la misma app, y google-services.json solo declara
            // `crystal.crystal`. Un sufijo dejaría al plugin de Google Services sin cliente que
            // corresponda y rompería el ensamblado.
            versionNameSuffix "-play"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding = 'UTF-8'
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ["-opt-in=kotlin.RequiresOptIn"]
    }
    kotlin {
        jvmToolchain(21)
    }

    buildFeatures {
        viewBinding true
        compose true
        // Necesario para leer versionCode/versionName desde el código (control de versión mínima
        // y etiquetado de los reportes de fallo). AGP 8 no lo genera si no se pide.
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // Las pruebas de campo se reparten como APK debug: los fallos deben reportarse igual.
            // No se sube el mapa de ofuscación porque debug no ofusca (y agiliza el ensamblado).
            firebaseCrashlytics { mappingFileUploadEnabled false }
        }
        release {
            // Sube el mapa de R8 para que las trazas lleguen con nombres legibles y no ofuscados.
            firebaseCrashlytics { mappingFileUploadEnabled true }
            minifyEnabled true          // R8: ofusca nombres y elimina código muerto
            shrinkResources false        // conservador: no borrar recursos (se accede a drawables por nombre)
            // Con keystore.properties presente firma con la clave de upload real; si no, cae a debug
            // (solo para pruebas locales, NO válido para publicar en Play).
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/INDEX.LIST"]
        }
    }

    lint {
        // No bloquear el ensamblado del release por lint (se sigue pudiendo correr `./gradlew lint`).
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // Pruebas que corren en el celular: lanzan la pantalla de verdad y pulsan sus botones.
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test:runner:1.5.2"
    androidTestImplementation "androidx.test:rules:1.5.0"

    // Firebase
    implementation platform("com.google.firebase:firebase-bom:32.8.0")
    implementation "com.google.firebase:firebase-auth-ktx"
    implementation "com.google.firebase:firebase-firestore-ktx"
    implementation "com.google.firebase:firebase-storage-ktx"
    implementation "com.google.firebase:firebase-analytics-ktx"
    // Reporte de fallos: sin esto, "se me cerró la app" no trae ni el error ni el equipo ni la
    // versión, y no hay forma de diagnosticar lo que reportan quienes prueban.
    implementation "com.google.firebase:firebase-crashlytics-ktx"
    implementation "com.google.firebase:firebase-functions-ktx"
    implementation "com.google.firebase:firebase-messaging-ktx"
    // App Check: verifica que las peticiones vienen de la app genuina (no scripts/APKs modificados)
    implementation "com.google.firebase:firebase-appcheck-playintegrity"
    debugImplementation "com.google.firebase:firebase-appcheck-debug"

    // Google Sign-In
    implementation "com.google.android.gms:play-services-auth:21.2.0"

    // Glide
    implementation "com.github.bumptech.glide:glide:4.16.0"
    ksp "com.github.bumptech.glide:compiler:4.16.0"

    // AndroidX
    implementation "androidx.activity:activity:1.9.3"
    implementation "androidx.activity:activity-ktx:1.9.3"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation platform("androidx.compose:compose-bom:2024.06.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"

    // Room
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    // Lifecycle
    def lifecycle_version = "2.7.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"

    // WorkManager
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1'

    // Otros
    implementation "com.google.code.gson:gson:2.10.1"
    implementation 'com.itextpdf:itext7-core:7.2.5'
    def media3_version = "1.3.1"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "com.airbnb.android:lottie:6.4.0"
    implementation "com.google.mlkit:text-recognition:16.0.1"
    implementation "com.iceteck.silicompressorr:silicompressor:2.2.3"
    implementation "commons-io:commons-io:2.13.0"
    implementation "com.caverock:androidsvg:1.4"
    implementation 'com.google.zxing:core:3.5.2'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    testImplementation "junit:junit:4.13.2"
}
